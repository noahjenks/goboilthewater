name: Render carousels and schedule them in HighLevel

# Runs when a week file in _social/carousels/ is pushed to main.
# Renders every carousel in the file to media/carousels/ (served at goboilthewater.com/media/carousels/),
# makes a preview.png sheet per carousel, writes the HighLevel CSV for the approved ones, and schedules the
# approved ones in HighLevel's Social Planner through its API (needs the GHL_TOKEN secret and GHL_LOCATION_ID variable;
# see _scripts/gbtw_ghl_schedule.py).
on:
  push:
    branches: [main]
    paths: ["_social/carousels/*.json"]
  workflow_dispatch:
    inputs:
      week:
        description: "Week file to rebuild, e.g. 2026-11-30"
        required: true

permissions:
  contents: write

concurrency:
  group: site-main
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find changed week files
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "_social/carousels/${{ github.event.inputs.week }}.json" > weeks.txt
          else
            git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- '_social/carousels/*.json' | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' > weeks.txt || true
          fi
          cat weeks.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Render, build CSV and schedule in HighLevel
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ vars.GHL_LOCATION_ID }}
          GHL_INSTAGRAM_ACCOUNT_ID: ${{ vars.GHL_INSTAGRAM_ACCOUNT_ID }}
          GHL_USER_ID: ${{ vars.GHL_USER_ID }}
        run: |
          while read -r f; do
            [ -f "$f" ] || continue
            python3 _scripts/gbtw_carousels_build.py "$f"
            python3 _scripts/gbtw_ghl_schedule.py /tmp/gbtw-manifest.json
          done < weeks.txt
      - name: Commit and push
        if: always()
        run: |
          git add media/carousels
          git add _social/carousels || true
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git -c user.name="Noah Jenks" -c user.email="noah.jenks@gmail.com" commit -q -m "Render carousels: $(tr '\n' ' ' < weeks.txt)"
          git pull -q --rebase origin main
          git push origin HEAD:main
